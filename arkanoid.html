<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkanoid</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #10131a;
        color: white;
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    h1 {
        margin: 0 0 12px;
    }

    .panel {
        width: min(700px, 100%);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        font-weight: bold;
        font-size: 18px;
    }

    canvas {
        width: min(700px, 100%);
        height: auto;
        border: 4px solid white;
        border-radius: 8px;
        background: #05070c;
        display: block;
        touch-action: none;
    }

    .buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    button {
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: bold;
        cursor: pointer;
        font-size: 16px;
    }

    #restartButton {
        background: #ff9800;
        color: white;
    }

    #soundButton {
        background: #607d8b;
        color: white;
    }

    .help {
        margin-top: 12px;
        color: #cfd8dc;
        text-align: center;
        font-size: 14px;
    }
</style>
</head>

<body>

<h1>🧱 ARKANOID</h1>

<div class="panel">
    <div>⭐ Puntos: <span id="score">0</span></div>
    <div>❤️ Vidas: <span id="lives">3</span></div>
    <div>🏆 Nivel: <span id="level">1</span></div>
</div>

<canvas id="gameCanvas" width="700" height="700"></canvas>

<div class="buttons">
    <button id="restartButton">🔄 Reiniciar</button>
    <button id="soundButton">🔊 Sonido</button>
</div>

<div class="help">
    Mueve la pala con ← → o A / D. También puedes usar el ratón o arrastrar en móvil.
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const levelElement = document.getElementById("level");
const restartButton = document.getElementById("restartButton");
const soundButton = document.getElementById("soundButton");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

let score;
let lives;
let level;
let gameOver;
let wonLevel;

let paddle;
let ball;
let bricks;

let leftPressed = false;
let rightPressed = false;

// =====================================================
// AUDIO
// =====================================================

let audioContext = null;
let soundEnabled = true;

function initAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}

function playTone(freq, duration, type = "square", volume = 0.04) {
    if (!soundEnabled) return;

    initAudio();

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);

    gain.gain.setValueAtTime(volume, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
}

function soundPaddle() {
    playTone(280, 0.07, "square", 0.035);
}

function soundWall() {
    playTone(180, 0.05, "square", 0.025);
}

function soundBrick() {
    playTone(520, 0.06, "square", 0.04);
}

function soundLoseLife() {
    playTone(140, 0.25, "sawtooth", 0.07);
}

function soundLevel() {
    [440, 550, 660, 880].forEach((freq, i) => {
        setTimeout(() => {
            playTone(freq, 0.15, "triangle", 0.05);
        }, i * 100);
    });
}

function soundGameOver() {
    [300, 240, 180, 120].forEach((freq, i) => {
        setTimeout(() => {
            playTone(freq, 0.2, "sawtooth", 0.05);
        }, i * 160);
    });
}

soundButton.addEventListener("click", () => {
    soundEnabled = !soundEnabled;

    soundButton.textContent =
        soundEnabled ? "🔊 Sonido" : "🔇 Silencio";

    if (soundEnabled) {
        initAudio();
        playTone(600, 0.1, "sine", 0.04);
    }
});

// =====================================================
// OBJETOS
// =====================================================

function createPaddle() {
    return {
        width: 120,
        height: 16,
        x: WIDTH / 2 - 60,
        y: HEIGHT - 50,
        speed: 8
    };
}

function createBall() {
    const speed = 5 + (level - 1) * 0.5;

    return {
        x: WIDTH / 2,
        y: HEIGHT - 80,
        radius: 9,
        dx: speed * (Math.random() > 0.5 ? 1 : -1),
        dy: -speed
    };
}

function createBricks() {
    bricks = [];

    const rows = 6 + Math.min(level - 1, 3);
    const cols = 10;

    const padding = 8;
    const brickWidth = 58;
    const brickHeight = 22;

    const totalWidth =
        cols * brickWidth + (cols - 1) * padding;

    const startX = (WIDTH - totalWidth) / 2;
    const startY = 80;

    for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
            bricks.push({
                x: startX + col * (brickWidth + padding),
                y: startY + row * (brickHeight + padding),
                width: brickWidth,
                height: brickHeight,
                alive: true,
                row
            });
        }
    }
}

// =====================================================
// JUEGO
// =====================================================

function startGame() {
    score = 0;
    lives = 3;
    level = 1;
    gameOver = false;
    wonLevel = false;

    paddle = createPaddle();
    ball = createBall();
    createBricks();

    updateUI();
}

function resetBall() {
    paddle = createPaddle();
    ball = createBall();
}

function updateUI() {
    scoreElement.textContent = score;
    livesElement.textContent = lives;
    levelElement.textContent = level;
}

restartButton.addEventListener("click", () => {
    initAudio();
    startGame();
});

// =====================================================
// CONTROLES
// =====================================================

window.addEventListener("keydown", event => {
    const key = event.key.toLowerCase();

    if (["arrowleft", "arrowright", "a", "d"].includes(key)) {
        event.preventDefault();
        initAudio();
    }

    if (key === "arrowleft" || key === "a") {
        leftPressed = true;
    }

    if (key === "arrowright" || key === "d") {
        rightPressed = true;
    }
});

window.addEventListener("keyup", event => {
    const key = event.key.toLowerCase();

    if (key === "arrowleft" || key === "a") {
        leftPressed = false;
    }

    if (key === "arrowright" || key === "d") {
        rightPressed = false;
    }
});

canvas.addEventListener("mousemove", event => {
    const rect = canvas.getBoundingClientRect();

    const scaleX = canvas.width / rect.width;

    const mouseX =
        (event.clientX - rect.left) * scaleX;

    paddle.x = mouseX - paddle.width / 2;

    keepPaddleInside();
});

canvas.addEventListener("touchmove", event => {
    event.preventDefault();

    initAudio();

    const rect = canvas.getBoundingClientRect();
    const touch = event.touches[0];

    const scaleX = canvas.width / rect.width;

    const touchX =
        (touch.clientX - rect.left) * scaleX;

    paddle.x = touchX - paddle.width / 2;

    keepPaddleInside();
}, { passive: false });

function keepPaddleInside() {
    paddle.x = Math.max(
        0,
        Math.min(WIDTH - paddle.width, paddle.x)
    );
}

// =====================================================
// ACTUALIZACIÓN
// =====================================================

function updatePaddle() {
    if (leftPressed) {
        paddle.x -= paddle.speed;
    }

    if (rightPressed) {
        paddle.x += paddle.speed;
    }

    keepPaddleInside();
}

function updateBall() {
    ball.x += ball.dx;
    ball.y += ball.dy;

    // Pared izquierda/derecha
    if (
        ball.x - ball.radius <= 0 ||
        ball.x + ball.radius >= WIDTH
    ) {
        ball.dx *= -1;
        soundWall();
    }

    // Techo
    if (ball.y - ball.radius <= 0) {
        ball.dy *= -1;
        soundWall();
    }

    // Pala
    if (
        ball.dy > 0 &&
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <= paddle.y + paddle.height &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width
    ) {
        ball.y = paddle.y - ball.radius;

        const hitPoint =
            (ball.x - (paddle.x + paddle.width / 2))
            / (paddle.width / 2);

        const speed =
            Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);

        const angle = hitPoint * Math.PI / 3;

        ball.dx = speed * Math.sin(angle);
        ball.dy = -Math.abs(speed * Math.cos(angle));

        soundPaddle();
    }

    // Pierde la bola
    if (ball.y - ball.radius > HEIGHT) {
        loseLife();
    }
}

// =====================================================
// COLISIONES CON LADRILLOS
// =====================================================

function checkBrickCollisions() {
    for (const brick of bricks) {
        if (!brick.alive) continue;

        if (
            ball.x + ball.radius > brick.x &&
            ball.x - ball.radius < brick.x + brick.width &&
            ball.y + ball.radius > brick.y &&
            ball.y - ball.radius < brick.y + brick.height
        ) {
            brick.alive = false;

            score += 10 * level;

            // Decidir eje del rebote
            const overlapLeft =
                ball.x + ball.radius - brick.x;

            const overlapRight =
                brick.x + brick.width - (ball.x - ball.radius);

            const overlapTop =
                ball.y + ball.radius - brick.y;

            const overlapBottom =
                brick.y + brick.height - (ball.y - ball.radius);

            const minOverlap = Math.min(
                overlapLeft,
                overlapRight,
                overlapTop,
                overlapBottom
            );

            if (
                minOverlap === overlapLeft ||
                minOverlap === overlapRight
            ) {
                ball.dx *= -1;
            } else {
                ball.dy *= -1;
            }

            soundBrick();
            updateUI();

            break;
        }
    }

    if (bricks.every(brick => !brick.alive)) {
        nextLevel();
    }
}

// =====================================================
// VIDAS Y NIVELES
// =====================================================

function loseLife() {
    lives--;

    soundLoseLife();

    if (lives <= 0) {
        lives = 0;
        gameOver = true;
        soundGameOver();
    } else {
        resetBall();
    }

    updateUI();
}

function nextLevel() {
    level++;

    soundLevel();

    paddle = createPaddle();
    ball = createBall();
    createBricks();

    updateUI();
}

// =====================================================
// DIBUJADO
// =====================================================

function drawBackground() {
    const gradient = ctx.createLinearGradient(
        0,
        0,
        0,
        HEIGHT
    );

    gradient.addColorStop(0, "#111a33");
    gradient.addColorStop(1, "#03050a");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Estrellas
    ctx.fillStyle = "rgba(255,255,255,0.4)";

    for (let i = 0; i < 35; i++) {
        const x = (i * 97) % WIDTH;
        const y = (i * 53) % HEIGHT;

        ctx.fillRect(x, y, 2, 2);
    }
}

function drawPaddle() {
    const gradient = ctx.createLinearGradient(
        paddle.x,
        paddle.y,
        paddle.x + paddle.width,
        paddle.y
    );

    gradient.addColorStop(0, "#00bcd4");
    gradient.addColorStop(0.5, "#ffffff");
    gradient.addColorStop(1, "#00bcd4");

    ctx.fillStyle = gradient;

    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );
}

function drawBall() {
    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#ffffff";
    ctx.fill();

    ctx.shadowBlur = 12;
    ctx.shadowColor = "white";

    ctx.fill();

    ctx.shadowBlur = 0;
}

function drawBricks() {
    const colors = [
        "#ff1744",
        "#ff9100",
        "#ffea00",
        "#00e676",
        "#00b0ff",
        "#7c4dff",
        "#e040fb",
        "#ff4081",
        "#69f0ae"
    ];

    bricks.forEach(brick => {
        if (!brick.alive) return;

        ctx.fillStyle =
            colors[brick.row % colors.length];

        ctx.fillRect(
            brick.x,
            brick.y,
            brick.width,
            brick.height
        );

        ctx.strokeStyle = "rgba(255,255,255,0.4)";

        ctx.strokeRect(
            brick.x,
            brick.y,
            brick.width,
            brick.height
        );
    });
}

function drawGameOver() {
    if (!gameOver) return;

    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.fillStyle = "white";
    ctx.textAlign = "center";

    ctx.font = "bold 52px Arial";

    ctx.fillText(
        "GAME OVER",
        WIDTH / 2,
        HEIGHT / 2 - 40
    );

    ctx.font = "24px Arial";

    ctx.fillText(
        "Puntuación: " + score,
        WIDTH / 2,
        HEIGHT / 2 + 10
    );

    ctx.font = "18px Arial";

    ctx.fillText(
        "Pulsa Reiniciar para jugar otra vez",
        WIDTH / 2,
        HEIGHT / 2 + 55
    );
}

// =====================================================
// BUCLE
// =====================================================

function gameLoop() {
    if (!gameOver) {
        updatePaddle();
        updateBall();
        checkBrickCollisions();
    }

    drawBackground();
    drawBricks();
    drawPaddle();
    drawBall();
    drawGameOver();

    requestAnimationFrame(gameLoop);
}

startGame();
gameLoop();
</script>

</body>
</html>
